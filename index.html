<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>吳家相簿</title>
<meta name="theme-color" content="#d23a2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="吳家相簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#fffdf9;--ink:#33231f;--soft:#6e5a55;--apricot:#ffd8c6;--sky:#cfeaf5;--coral:#d23a2a;--paper:#fff;--line:#eadbd2;font-size:20px}
html.big{font-size:25px}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 "Noto Sans TC",system-ui,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
h1,h2{margin:0;font-weight:900;line-height:1.2}
.top{background:var(--apricot);padding:calc(20px + env(safe-area-inset-top)) 18px 26px;text-align:center}
h1{font-size:1.7rem}
.age{font-size:1.15rem;margin:8px 0 16px}
.age b{color:var(--coral);font-size:1.5rem}
.back{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;font:700 1rem "Noto Sans TC",sans-serif;min-height:52px;padding:6px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.big-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:520px;margin:0 auto;min-height:76px;padding:14px 20px;border:0;border-radius:20px;background:var(--coral);color:#fff;font:900 1.3rem "Noto Sans TC",sans-serif;cursor:pointer;box-shadow:0 6px 0 #9d2618}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9d2618}
.big-btn svg{width:38px;height:38px;flex:none}
.btn{font:700 1rem "Noto Sans TC",sans-serif;min-height:58px;padding:10px 22px;border-radius:16px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.main{background:var(--coral);border-color:var(--coral);color:#fff}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #1d6fd6;outline-offset:2px}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.tools .btn{min-height:50px;font-size:.9rem;padding:8px 16px;background:transparent}
main{padding:10px 14px 30px;max-width:1000px;margin:0 auto}
/* 密碼畫面 */
.lock{min-height:100vh;display:grid;place-items:center;background:var(--apricot);padding:24px 18px;text-align:center}
.lock img{width:120px;height:120px;border-radius:28px;box-shadow:0 8px 20px rgba(80,40,30,.2)}
.lock h1{margin:18px 0 6px}
.lock p{margin:0 0 18px;color:var(--soft)}
.line-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:360px;margin:0 auto;min-height:72px;padding:12px 20px;border:0;border-radius:20px;background:#06c755;color:#fff;font:900 1.25rem "Noto Sans TC",sans-serif;cursor:pointer;box-shadow:0 6px 0 #04913e}
.line-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #04913e}
.line-btn svg{width:34px;height:34px;flex:none}
.lock .note{font-size:.85rem;margin-top:14px}
.linklike{display:block;margin:18px auto 0;background:none;border:0;color:var(--ink);font:700 1rem "Noto Sans TC",sans-serif;text-decoration:underline;min-height:48px;cursor:pointer}
.pwbox{max-width:380px;margin:16px auto 0;background:var(--paper);border-radius:20px;padding:18px 16px;text-align:start;box-shadow:0 6px 18px rgba(80,40,30,.12)}
.pwbox label{display:block;font-weight:700;margin-bottom:4px}
.pwbox input{width:100%;font:900 1.3rem "Noto Sans TC",sans-serif;text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.pwbox .showpw{display:block;margin:8px auto 14px;font:700 .95rem "Noto Sans TC",sans-serif;min-height:46px;padding:6px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.pwbox .showpw[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.pwbox .who{margin:6px 0 10px}
.pwbox .who .btn{min-height:54px;font-size:1rem;padding:6px}
.pwbox .who .btn[aria-pressed=true]{background:var(--coral);border-color:var(--coral);color:#fff}
.pwbox #pwName{font:700 1.05rem "Noto Sans TC",sans-serif;margin-bottom:14px}
.lock .err{color:var(--coral);font-weight:700;min-height:1.6em;margin:0 0 8px}
/* 安裝提示 */
.install{max-width:520px;margin:14px auto 0;background:var(--paper);border-radius:18px;padding:14px 16px;text-align:start;box-shadow:0 4px 14px rgba(80,40,30,.12)}
.install b{display:block;font-size:1.05rem;margin-bottom:4px}
.install p{margin:0;font-size:.9rem;color:var(--soft)}
.install .row{display:flex;gap:10px;margin-top:10px}
.install .row .btn{flex:1;min-height:52px;font-size:.95rem}
.share-ico{display:inline-block;vertical-align:-4px;width:22px;height:22px}
/* 相簿清單 */
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:18px;margin-top:10px}
.al{display:block;width:100%;padding:0;border:0;background:var(--paper);border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(80,40,30,.14);cursor:pointer;text-align:start;color:inherit;font:inherit}
.al .cv{aspect-ratio:4/3;background:var(--sky);display:grid;place-items:center;overflow:hidden}
.al .cv img{width:100%;height:100%;object-fit:cover;display:block}
.al .cv svg{width:40%;height:40%}
.al .t{padding:12px 16px 16px}
.al b{display:block;font-size:1.3rem;font-weight:900}
.al span{color:var(--soft);font-size:.85rem}
.add-al{border:3px dashed var(--line);background:transparent;box-shadow:none;min-height:180px;display:grid;place-items:center;font:900 1.15rem "Noto Sans TC",sans-serif;color:var(--soft)}
/* 相簿內 */
.year{font-size:1.8rem;margin:30px 4px 0;color:var(--coral)}
.month h2{font-size:1.35rem;margin:18px 4px 12px;padding-bottom:6px;border-bottom:3px solid var(--apricot);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.month h2 small{font-size:.85rem;font-weight:400;color:var(--soft)}
.jump{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.jump button{flex:none;font:700 .9rem "Noto Sans TC",sans-serif;min-height:48px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ph{position:relative;display:block;width:100%;padding:0;border:0;background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(80,40,30,.12);cursor:pointer;text-align:start;color:inherit;font:inherit}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--sky)}
.ph span{display:block;padding:6px 10px 8px;font-size:.8rem;color:var(--soft)}
.ph .vb{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;padding:3px 10px;border-radius:99px}
.empty{text-align:center;padding:40px 10px;color:var(--soft);font-size:1.1rem}
.wishes{background:var(--sky);padding:26px 16px 40px}
.wishes .in{max-width:700px;margin:0 auto}
.wishes h2{font-size:1.5rem;margin-bottom:14px}
textarea{width:100%;font:1.05rem "Noto Sans TC",sans-serif;padding:14px;border-radius:16px;border:2px solid var(--line);min-height:110px;background:var(--paper);color:var(--ink)}
.wish{background:var(--paper);border-radius:16px;padding:14px 16px;margin-top:12px}
.wish p{margin:0;font-size:1.1rem;white-space:pre-wrap;overflow-wrap:anywhere}
.wish small{display:block;color:var(--soft);font-size:.8rem;margin-top:6px}
.wish button{font:inherit;font-size:.8rem;background:none;border:0;color:var(--coral);text-decoration:underline;cursor:pointer;min-height:40px}
/* 看照片 */
.layer{position:fixed;inset:0;z-index:20;display:none;background:rgba(25,16,14,.94);color:#fff;flex-direction:column;padding-top:env(safe-area-inset-top)}
.layer.on{display:flex}
.view-img{flex:1;display:grid;place-items:center;padding:12px;min-height:0}
.view-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.view-img iframe{width:100%;height:100%;border:0;border-radius:8px;background:#000}
.view-info{background:var(--paper);color:var(--ink);padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.view-info p{margin:0 0 10px;font-size:1.05rem}
.view-info .when{font-weight:900;font-size:1.15rem;margin:0}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.nav .btn{width:100%;padding:8px 4px}
.extra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.extra .btn{min-height:52px;font-size:.9rem;padding:6px 4px}
/* 對話框 */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(25,16,14,.6);display:none;align-items:center;justify-content:center;padding:16px}
.sheet.on{display:flex}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px 18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.card h2{font-size:1.4rem;margin-bottom:14px;text-align:center}
.card .hint{color:var(--soft);font-size:.85rem;margin:-6px 0 10px}
.card ol{margin:0 0 14px;padding-left:1.4em}
.card li{margin:6px 0}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who .btn{min-height:64px;font-size:1.1rem}
.card input,.card select{width:100%;font:1.05rem "Noto Sans TC",sans-serif;padding:12px;border-radius:14px;border:2px solid var(--line);min-height:58px;margin:6px 0 12px;background:var(--paper);color:var(--ink)}
.card label{font-weight:700;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.msg{font-size:1.25rem;text-align:center;font-weight:700;margin:6px 0 14px}
.cal-go{margin:4px auto 18px;background:#1d7a5a;box-shadow:0 6px 0 #0f4f39}
.cal{max-width:640px;margin:0 auto}
.cal h2{font-size:1.25rem;margin:22px 0 6px}
.ci{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 4px 12px rgba(80,40,30,.1)}
.ci .dt{min-width:5.2em;font-weight:900;color:var(--coral);line-height:1.3}
.ci .dt small{display:block;color:var(--soft);font-weight:700;font-size:.8rem}
.ci .tx{flex:1;line-height:1.4}
.ci .tx small{display:block;color:var(--soft);font-size:.8rem}
.ci .x{min-height:48px;padding:6px 12px;font-size:.85rem}
.ci.past{opacity:.55}
.cal .tip{background:var(--sky);border-radius:16px;padding:12px 14px;font-size:.9rem;line-height:1.6;margin-top:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.seg .btn[aria-pressed=true]{background:var(--coral);border-color:var(--coral);color:#fff}
.dm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.seg4 button{font:900 1.1rem "Noto Sans TC",sans-serif;min-height:56px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.seg4 button[aria-pressed=true]{background:var(--ink);color:#fff}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:16px 0 10px}
.cnav b{font-size:1.25rem;text-align:center;flex:1}
.cnav .btn{min-height:52px;padding:6px 14px;font-size:1rem}
.cnav .btn.today{font-size:.9rem;padding:6px 10px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mgrid .wd{text-align:center;font-weight:900;color:var(--soft);font-size:.8rem;padding:4px 0}
.mgrid .wd.sun,.mc.sun .n{color:var(--coral)}
.mc{min-height:74px;background:var(--paper);border-radius:10px;padding:3px;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:2px;overflow:hidden;text-align:left;font:inherit;color:inherit;min-width:0}
.mc.blank{visibility:hidden}
.mc .n{font-weight:900;font-size:.85rem;align-self:flex-start;padding:0 5px;border-radius:999px}
.mc.today .n{background:var(--coral);color:#fff!important}
.mc.sel{border-color:var(--ink)}
.chip{display:block;font-size:.62rem;line-height:1.3;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .ics{font-size:.95rem;line-height:1.1;letter-spacing:-1px;word-break:break-all}
.mc .ics em{font-style:normal;font-size:.65rem;color:var(--soft);font-weight:900;letter-spacing:0}
.mc.has{background:#fff4ef}
.selh{font-size:1.3rem;margin:20px 0 4px;scroll-margin-top:12px}
.selh small{font-size:.85rem;color:var(--soft);margin-left:8px}
.mc .more{font-size:.62rem;color:var(--soft);font-weight:700}
.k-event{background:#fde2dd;color:#8a2416}
.k-birthday{background:#ffe6c2;color:#7a4a00}
.k-anniv{background:#f6dcef;color:#7a2462}
.k-milestone{background:#d6efe2;color:#16613f}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;font-size:.8rem}
.legend .chip{font-size:.8rem;padding:2px 8px}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ym{background:var(--paper);border-radius:14px;padding:8px 6px;cursor:pointer;border:2px solid transparent;font:inherit;color:inherit;text-align:center;box-shadow:0 3px 10px rgba(80,40,30,.08)}
.ym.cur{border-color:var(--coral)}
.ym h3{font-size:1rem;margin:0 0 4px;color:var(--coral)}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:.62rem}
.ym .g i{font-style:normal;padding:2px 0;border-radius:4px}
.ym .g i.has{background:#fde2dd;font-weight:900;color:#8a2416}
.ym .g i.today{background:var(--coral);color:#fff}
.ym small{display:block;color:var(--soft);font-size:.75rem;margin-top:4px}
.dhead{font-size:1.35rem;font-weight:900;text-align:center;flex:1}
.ci .acts{display:flex;flex-direction:column;gap:6px}
.ci .k{font-size:1.4rem}
.bar{height:16px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--coral);transition:width .3s}
</style>
</head>
<body>

<!-- 第一次：輸入家族密碼 -->
<section class="lock" id="lock" hidden>
  <div>
    <img src="icon-512.png" alt="吳家相簿">
    <h1>吳家相簿</h1>
    <p id="lockMsg">吳家家人專用<br>可用 LINE 登入，或輸入家族密碼登入<br>（只有第一次需要登入，之後就不用再登入）</p>
    <p class="err" id="pwErr"></p>
    <button class="line-btn" id="lineBtn"><svg viewBox="0 0 48 48"><path fill="#fff" d="M24 6C12.4 6 3 13.6 3 23c0 8.4 7.5 15.4 17.6 16.8.7.2 1.6.5 1.9 1 .2.5.1 1.2.1 1.7l-.3 1.8c-.1.5-.4 2.1 1.8 1.1 2.3-.9 12.2-7.2 16.6-12.3C43.7 29.8 45 26.6 45 23 45 13.6 35.6 6 24 6z"/><path fill="#06c755" d="M14 27.5h-3.5a1 1 0 0 1-1-1v-7a1 1 0 0 1 2 0v6H14a1 1 0 0 1 0 2zm3.5-1a1 1 0 0 1-2 0v-7a1 1 0 0 1 2 0zm9 0a1 1 0 0 1-1.8.6L21 22.6v3.9a1 1 0 0 1-2 0v-7a1 1 0 0 1 1.8-.6l3.7 5v-4.4a1 1 0 0 1 2 0zm6.5-5h-2.5v1.5H33a1 1 0 0 1 0 2h-2.5V25H33a1 1 0 0 1 0 2h-3.5a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1H33a1 1 0 0 1 0 2z"/></svg>用 LINE 登入</button>
    <p class="note" id="lockNote"></p>
    <button class="linklike" id="pwToggle" type="button">或是 用家族密碼登入</button>
    <div class="pwbox" id="pwBox" hidden>
      <label for="pwIn">家族密碼</label>
      <input id="pwIn" type="password" autocomplete="current-password" placeholder="家族密碼">
      <button class="showpw" id="pwShow" type="button" aria-pressed="false">顯示密碼</button>
      <label>請問你是？</label>
      <div class="who" id="pwWho"></div>
      <input id="pwName" maxlength="20" placeholder="或自己寫，例如：大姑姑" aria-label="自己寫名字">
      <button class="big-btn" id="pwGo" type="button">進入相簿</button>
    </div>
  </div>
</section>

<!-- 首頁：所有相簿 -->
<section id="home" hidden>
  <header class="top">
    <h1 id="hTitle">吳家相簿</h1>
    <p class="age">點一本相簿進去看</p>
    <div class="tools"><button class="btn" data-big>字放大</button><button class="btn" data-reload>重新整理</button><button class="btn" id="logoutBtn"><span data-me>登出</span></button></div>
    <div class="install" id="installBox" hidden></div>
  </header>
  <main><button class="big-btn cal-go" id="calBtn">📅 家族行事曆・生日提醒</button><div class="albums" id="albums"><p class="empty">相簿載入中，請稍等…</p></div></main>
</section>

<!-- 單本相簿 -->
<section id="one" hidden>
  <header class="top">
    <button class="back" id="backBtn">← 回到所有相簿</button>
    <h1 id="aTitle"></h1>
    <p class="age" id="aAge"></p>
    <button class="big-btn" id="addBtn">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"><path d="M6 16h8l4-6h12l4 6h8v24H6z"/><circle cx="24" cy="27" r="8"/></svg>
      放照片、影片
    </button>
    <div class="tools">
      <button class="btn" data-big>字放大</button>
      <button class="btn" id="infoBtn">相簿名字、生日</button>
      <a class="btn" id="allBtn" target="_blank" rel="noopener">整本下載</a>
    </div>
  </header>
  <nav class="jump" id="jump" aria-label="跳到月份" hidden></nav>
  <main id="album"></main>
  <section class="wishes">
    <div class="in">
      <h2 id="wTitle">留言</h2>
      <textarea id="wtext" maxlength="200" placeholder="在這裡寫下想說的話"></textarea>
      <button class="big-btn" id="wsend" style="margin-top:12px;min-height:64px;font-size:1.15rem">送出留言</button>
      <div id="wlist"></div>
    </div>
  </section>
</section>
<!-- 家族行事曆 -->
<section id="calv" hidden>
  <header class="top">
    <button class="back" id="calBack">← 回到所有相簿</button>
    <h1>家族行事曆</h1>
    <p class="age">生日、紀念日、聚會、回診<br>小幫手會在前一天到 LINE 群組提醒大家</p>
  </header>
  <main class="cal">
    <div class="seg4" id="calTabs"><button data-v="day" aria-pressed="false">日</button><button data-v="month" aria-pressed="true">月</button><button data-v="year" aria-pressed="false">年</button><button data-v="list" aria-pressed="false">清單</button></div>
    <div class="row2"><button class="big-btn" id="evAdd" style="font-size:1rem;min-height:70px;padding:10px">＋ 新增活動</button><button class="big-btn" id="dayAdd" style="font-size:1rem;min-height:70px;padding:10px">＋ 生日紀念日</button></div>
    <div id="calBody"><p class="empty">載入中，請稍等…</p></div>
    <div class="tip"><b>也可以在 LINE 群組直接打字：</b><br>提醒 12/31 18:00 跨年聚餐<br>提醒 明天 10:00 阿嬤回診<br>生日 阿嬤 農曆 3/15<br>紀念日 爸媽結婚 1990/6/20<br>行事曆　（看全部）</div>
  </main>
</section>

<input type="file" id="file" accept="image/*,video/*" multiple hidden>

<script>
(function(){

var $=function(id){return document.getElementById(id)};

var D={title:'吳家相簿',albums:[],photos:[],wishes:[]},A=null,list=[],cur=-1,loaded=false;
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};

var BOOK='<svg viewBox="0 0 100 100"><rect x="18" y="14" width="64" height="72" rx="6" fill="#fff"/><rect x="28" y="26" width="44" height="34" rx="3" fill="#ffd8c6"/><circle cx="40" cy="38" r="5" fill="#fff"/><path d="M28 60l14-14 10 10 8-6 12 10z" fill="#d23a2a" opacity=".7"/></svg>';
var SHARE='<svg class="share-ico" viewBox="0 0 24 24" fill="none" stroke="#1d6fd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>';

/* ---------- 和後台溝通（每次帶 LINE 登入憑證） ---------- */
var LIFF_ID='2012799851-mzkQQKAl';
function api(fn){var args=[].slice.call(arguments,1);
  return fetch(API,{method:'POST',body:JSON.stringify({session:store.get('session')||'',fn:fn,args:args})})
    .then(function(r){return r.json()})
    .then(function(j){if(j.ok)return j.data;
      if(j.code==='auth'||j.code==='notmember'){store.del('session');showLock(j.code==='notmember'?'你不在吳家 LINE 群組裡，請先請家人把你加進吳家群組，再重新登入。':(j.error&&/密碼/.test(j.error)?j.error:'請重新登入。'))}
      var e=new Error(j.error||'失敗');e.code=j.code;throw e})}

/* ---------- LINE 登入畫面 ---------- */
function showLock(msg){$('lock').hidden=false;$('home').hidden=true;$('one').hidden=true;$('calv').hidden=true;closeV();closeSheet();$('pwErr').textContent=msg||'';$('lineBtn').disabled=false}
var liffReady=null;
function initLiff(){if(liffReady)return liffReady;
  liffReady=(window.liff&&LIFF_ID.indexOf('__')<0)?liff.init({liffId:LIFF_ID}).then(function(){return liff}):Promise.reject(new Error('nolift'));
  return liffReady}
function finishLogin(){var tok=liff.getIDToken();if(!tok){liff.logout();return startLogin()}
  $('pwErr').textContent='確認身分中，請稍等…';$('lineBtn').disabled=true;
  return fetch(API,{method:'POST',body:JSON.stringify({fn:'login',args:[tok]})}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok){$('lineBtn').disabled=false;
      if(j.code==='notmember'){$('pwErr').textContent='你不在吳家 LINE 群組裡。請先請家人把你加進吳家群組，再按一次登入。';try{liff.logout()}catch(e){}}
      else if(j.code==='setup')$('pwErr').textContent='相簿還在設定中，請稍後再試。';
      else{$('pwErr').textContent='登入沒有成功，請再按一次。';try{liff.logout()}catch(e){}}

    store.set('session',j.data.session);store.set('name',j.data.name);showMe();
    $('pwErr').textContent='';$('lock').hidden=true;$('home').hidden=false;load();route()
  },function(){$('lineBtn').disabled=false;$('pwErr').textContent='網路不穩，請再按一次登入。'})}
function startLogin(){$('lineBtn').disabled=true;$('pwErr').textContent='正在連到 LINE…';
  initLiff().then(function(){if(liff.isLoggedIn())return finishLogin();liff.login({redirectUri:location.origin+location.pathname})},

/* ---------- 家族密碼登入（給不用 LINE 的家人） ---------- */

    if(!j.ok){$('pwErr').textContent=j.code==='pw'?'密碼不對，可以按「顯示密碼」檢查一下':'沒有成功，請再試一次';return}

function months(b,d){var B=new Date(b),X=new Date(d);if(!b||isNaN(B)||isNaN(X))return null;if(X<B)return -1;var m=(X.getFullYear()-B.getFullYear())*12+X.getMonth()-B.getMonth();if(X.getDate()<B.getDate())m--;return m}

/* ---------- 安裝到手機桌面 ---------- */

  else if(deferred)html='<b>把相簿放到手機桌面</b><p>以後一點就打開，不用再找連結。</p><div class="row"><button class="btn main" id="instGo">安裝到桌面</button><button class="btn" id="instNo">先不要</button></div>';

function iosHelp(){sheet('<h2>放到 iPhone 桌面</h2><ol><li>按 Safari 下面中間的分享按鈕 '+SHARE+'</li><li>往下滑，按「加入主畫面」</li><li>按右上角「新增」</li></ol><p class="hint">要用 Safari 打開才有「加入主畫面」。</p><button class="big-btn" id="sOk" style="min-height:64px">知道了</button>');$('sOk').onclick=closeSheet}

/* ---------- 首頁 ---------- */
function renderHome(){
  $('hTitle').textContent=D.title;document.title=D.title;showMe();renderInstall();
  if(!loaded){$('albums').innerHTML='<p class="empty">相簿載入中，請稍等…</p>';return}
  var html=D.albums.slice().sort(function(a,b){return a.at-b.at}).map(function(a){
    var ps=D.photos.filter(function(p){return p.album===a.id&&p.kind!=='video'}).sort(function(x,y){return(y.taken||'').localeCompare(x.taken||'')||y.at-x.at});
    var n=D.photos.filter(function(p){return p.album===a.id}).length;
    var age=a.birth?label(months(a.birth,new Date())):'';
    return'<button class="al" data-a="'+esc(a.id)+'"><div class="cv">'+(ps[0]?'<img loading="lazy" alt="" src="'+thumb(ps[0].file,800)+'">':BOOK)+'</div><div class="t"><b>'+esc(a.name)+'</b><span>'+n+' 個照片和影片'+(age?'・'+esc(age):'')+'</span></div></button>'}).join('');
  $('albums').innerHTML=html+'<button class="al add-al" id="newAl">＋ 新增一本相簿</button>';

$('albums').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b){location.hash='album-'+b.dataset.a;return}if(e.target.closest('#newAl'))albumForm(null)});

/* ---------- 換頁（用網址 # 記住在哪本相簿） ---------- */
function route(){if(!store.get('session'))return;
  if(location.hash==='#cal'){A=null;closeV();$('home').hidden=true;$('one').hidden=true;$('calv').hidden=false;loadCal();return}
  $('calv').hidden=true;var m=/^#album-(.+)$/.exec(location.hash);
  if(m){A=D.albums.filter(function(a){return a.id===m[1]})[0]||null;
    if(!A){if(loaded){location.hash='';return}}
    $('home').hidden=true;$('one').hidden=false;if(A)renderAlbum();else{$('aTitle').textContent='載入中…';$('album').innerHTML=''}}
  else{A=null;closeV();$('one').hidden=true;$('home').hidden=false;renderHome()}}
window.addEventListener('hashchange',function(){window.scrollTo(0,0);route()});
$('backBtn').onclick=function(){if(location.hash)location.hash='';else route()};

function renderAlbum(){if(!A)return;
  $('aTitle').textContent=A.name;document.title=A.name+'・'+D.title;
  if(A.birth){var days=Math.floor((new Date()-new Date(A.birth))/864e5)+1,m=months(A.birth,new Date());
    $('aAge').innerHTML=days>0?esc(A.name)+'今天出生第 <b>'+days+'</b> 天'+(m>=1?'<br>'+esc(label(m)):''):'還沒出生';}
  else $('aAge').textContent='';
  $('allBtn').href=A.folder;
  $('wTitle').textContent=A.birth?'給'+A.name+'說句話':'留言';
  list=D.photos.filter(function(p){return p.album===A.id}).sort(function(a,b){return(b.taken||'').localeCompare(a.taken||'')||b.at-a.at});
  if(!list.length){$('album').innerHTML='<p class="empty">這本相簿還沒有照片。<br>按上面紅色按鈕「放照片、影片」就可以放第一張。</p>';$('jump').hidden=true;}
  else{
    var groups=[],map={};
    list.forEach(function(p,i){var ym=(p.taken||'').slice(0,7)||'其他';if(!map[ym]){map[ym]={ym:ym,items:[]};groups.push(map[ym])}map[ym].items.push(i)});
    var html='',lastY=null;
    groups.forEach(function(g){var y=g.ym.slice(0,4),mo=+g.ym.slice(5,7);
      if(y!==lastY){html+='<h2 class="year">'+esc(y)+' 年</h2>';lastY=y}
      var ages=A.birth?g.items.map(function(i){return months(A.birth,list[i].taken)}).filter(function(m){return m!==null}):[];
      var age='';if(ages.length){var lo=Math.min.apply(null,ages),hi=Math.max.apply(null,ages);age=hi<0?'出生之前':(lo===hi?label(lo):label(Math.max(lo,0))+'～'+label(hi))}
      html+='<section class="month" id="m'+esc(g.ym)+'"><h2>'+(mo?mo+' 月':'其他')+'<small>'+(age?esc(age)+'・':'')+g.items.length+' 個</small></h2><div class="grid">';
      g.items.forEach(function(i){var p=list[i];
        html+='<button class="ph" data-i="'+i+'"><img loading="lazy" alt="'+esc(p.caption||'照片')+'" src="'+thumb(p.file,600)+'" onerror="this.style.opacity=.3">'+(p.kind==='video'?'<b class="vb">▶ 影片</b>':'')+'<span>'+esc(p.caption||pretty(p.taken))+'</span></button>'});
      html+='</div></section>'});
    $('album').innerHTML=html;
    $('jump').innerHTML=groups.map(function(g){return'<button data-ym="'+esc(g.ym)+'">'+esc(g.ym.length===7?g.ym.slice(0,4)+' 年 '+(+g.ym.slice(5))+' 月':g.ym)+'</button>'}).join('');
    $('jump').hidden=groups.length<2;}
  var w=D.wishes.filter(function(x){return x.album===A.id}).sort(function(a,b){return b.at-a.at});
  $('wlist').innerHTML=w.map(function(x){return'<div class="wish"><p>'+esc(x.text)+'</p><small>'+esc(x.by||'家人')+'・'+esc(new Date(x.at).toLocaleDateString('zh-TW'))+' <button data-w="'+esc(x.id)+'">刪除</button></small></div>'}).join('');
}

var busy=false;
function load(){if(busy||!store.get('session'))return;busy=true;
  api('getData').then(function(d){busy=false;D=d;loaded=true;route();if(cur>=0)show(Math.min(cur,list.length-1))},
    function(e){busy=false;if(e.code!=='auth'&&e.code!=='notmember')done('網路不穩，請按「重新整理」')})}

/* ---------- 看照片 ---------- */
function show(i){var p=list[i];if(!p){closeV();return}cur=i;
  $('vbox').innerHTML=p.kind==='video'
    ?'<iframe src="https://drive.google.com/file/d/'+encodeURIComponent(p.file)+'/preview" allow="autoplay; fullscreen" allowfullscreen title="影片"></iframe>'
    :'<img alt="'+esc(p.caption||'照片')+'" src="'+thumb(p.file,2000)+'">';
  $('vdown').href='https://drive.google.com/uc?export=download&id='+encodeURIComponent(p.file);
  $('vwhen').textContent=pretty(p.taken)+(A&&A.birth?'・'+label(months(A.birth,p.taken)):'');
  $('vcap').textContent=(p.caption||'')+(p.by?'（'+p.by+' 放的）':'');
  $('vprev').disabled=i===0;$('vnext').disabled=i===list.length-1;
  $('viewer').classList.add('on');document.body.style.overflow='hidden'}
function closeV(){$('viewer').classList.remove('on');$('vbox').innerHTML='';document.body.style.overflow='';cur=-1}
$('jump').addEventListener('click',function(e){var b=e.target.closest('[data-ym]');if(!b)return;var t=document.getElementById('m'+b.dataset.ym);if(t)t.scrollIntoView({behavior:'smooth'})});
$('album').addEventListener('click',function(e){var b=e.target.closest('.ph');if(b)show(+b.dataset.i)});
$('vprev').onclick=function(){show(cur-1)};$('vnext').onclick=function(){show(cur+1)};$('vclose').onclick=closeV;
var sx=null;$('viewer').addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
$('viewer').addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(dx>60&&cur>0)show(cur-1);else if(dx<-60&&cur<list.length-1)show(cur+1)});
document.addEventListener('keydown',function(e){if(cur<0||e.target.matches('input,textarea,select'))return;if(e.key==='Escape')closeV();if(e.key==='ArrowLeft'&&cur>0)show(cur-1);if(e.key==='ArrowRight'&&cur<list.length-1)show(cur+1)});

/* ---------- 對話框 ---------- */

function closeSheet(){$('sheet').classList.remove('on')}

function done(text){sheet('<p class="msg">'+esc(text)+'</p><button class="big-btn" id="sOk" style="min-height:64px">好</button>');$('sOk').onclick=closeSheet}

/* ---------- 讀拍攝日期：照片讀 EXIF，影片讀 MP4/MOV 檔頭；讀不到才用檔案日期 ---------- */
function day(t){var d=new Date(t||Date.now());d=new Date(d-d.getTimezoneOffset()*6e4);return d.toISOString().slice(0,10)}
function readBuf(f,a,b){return f.slice(a,b).arrayBuffer()}
function photoDate(f){return readBuf(f,0,262144).then(function(buf){
  var v=new DataView(buf),o=2;if(v.getUint16(0)!==0xFFD8)return null;
  while(o+4<v.byteLength){var mk=v.getUint16(o),len=v.getUint16(o+2);
    if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){var t=o+10,le=v.getUint16(t)===0x4949;
      var u16=function(p){return v.getUint16(p,le)},u32=function(p){return v.getUint32(p,le)};
      var tag=function(ifd,id){var n=u16(t+ifd);for(var k=0;k<n;k++){var e=t+ifd+2+k*12;if(u16(e)===id)return e}return 0};
      var str=function(e){var p=t+u32(e+8),s='';for(var k=0;k<19;k++)s+=String.fromCharCode(v.getUint8(p+k));return s};
      var ifd0=u32(t+4),ex=tag(ifd0,0x8769),e;
      if(ex){e=tag(u32(ex+8),0x9003);if(e)return str(e)}
      e=tag(ifd0,0x0132);return e?str(e):null}
    if((mk&0xFF00)!==0xFF00)break;o+=2+len}
  return null}).then(function(s){var m=/^(\d{4}):(\d{2}):(\d{2})/.exec(s||'');return m&&m[1]>'1990'?m[1]+'-'+m[2]+'-'+m[3]:null}).catch(function(){return null})}
function videoDate(f){var pos=0,tries=0;
  function box(){if(pos+16>f.size||tries++>40)return Promise.resolve(null);
    return readBuf(f,pos,pos+16).then(function(b){var v=new DataView(b),size=v.getUint32(0),type=String.fromCharCode(v.getUint8(4),v.getUint8(5),v.getUint8(6),v.getUint8(7));
      if(size===1)size=v.getUint32(8)*4294967296+v.getUint32(12);else if(size===0)size=f.size-pos;
      if(type==='moov')return readBuf(f,pos,pos+Math.min(size,4194304)).then(function(mb){var d=new DataView(mb);
        for(var i=8;i+24<d.byteLength;i++){if(d.getUint32(i)===0x6D766864){var ver=d.getUint8(i+4),secs=ver===1?d.getUint32(i+8)*4294967296+d.getUint32(i+12):d.getUint32(i+8);
          if(secs>2082844800+631152000)return day((secs-2082844800)*1000);return null}}return null});
      if(size<8)return null;pos+=size;return box()})}
  return box().catch(function(){return null})}
function takenOf(f){return(f.type.indexOf('video/')===0?videoDate(f):photoDate(f)).then(function(d){return d||day(f.lastModified)})}

/* ---------- 上傳（照片先縮小；影片每段 8MB） ---------- */
function shrink(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),img=new Image();
  img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};
  img.onerror=function(){URL.revokeObjectURL(u);rej()};img.src=u})}
var CHUNK=8*1024*1024;
function b64(f,a,b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(f.slice(a,b))})}
function sendVideo(f,taken,who,album,onPct){
  return api('startVideo',f.name,f.type||'video/mp4',f.size,taken,album).then(function(key){var start=0;
    function step(){var end=Math.min(start+CHUNK,f.size);
      return b64(f,start,end).then(function(data){return api('putChunk',key,data,start)}).then(function(id){
        start=end;onPct(start/f.size);if(id)return api('finishVideo',key,id,taken,'',who);if(start>=f.size)throw new Error('上傳沒有完成');return step()})}
    return step()})}
$('addBtn').onclick=function(){whoAmI(function(){$('file').click()})};
$('file').onchange=function(e){var files=[].slice.call(e.target.files);e.target.value='';if(!files.length||!A)return;
  var who=me(),album=A.id,n=0,ok=0,big=0;
  sheet('<p class="msg" id="pMsg">正在放進相簿…</p><div class="bar"><i id="pBar"></i></div><p style="text-align:center;color:var(--soft)">請不要關掉畫面</p>');
  var bar=function(part){$('pBar').style.width=Math.round((n-1+part)/files.length*100)+'%'};
  (function next(){if(n>=files.length){load();done(ok===files.length?'放好了！共 '+ok+' 個':'放好 '+ok+' 個，有 '+(files.length-ok)+' 個沒成功'+(big?'（影片超過 300MB）':'')+'，可以再試一次');return}
    var f=files[n++],isV=f.type.indexOf('video/')===0;
    $('pMsg').textContent='正在放第 '+n+' 個，共 '+files.length+' 個'+(isV?'（影片比較久）':'');bar(0);
    if(isV&&f.size>300*1024*1024){big++;next();return}
    takenOf(f).then(function(taken){
      if(isV)return sendVideo(f,taken,who,album,bar);
      return shrink(f).then(function(url){return api('uploadPhoto',url,album,taken,'',who)})
    }).then(function(){ok++;next()},function(){next()})})()};

/* ---------- 家族行事曆：日 / 月 / 年 / 清單 ---------- */
var C=null,calBusy=false,YC={},calView=store.get('calView')||'month',calSel=null;
$('calBtn').onclick=function(){location.hash='cal'};
$('calBack').onclick=function(){location.hash=''};
var WD='日一二三四五六',ICON={event:'📅',birthday:'🎂',anniv:'💝',milestone:'👶'};
function pd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}
function todayS(){return ymd(new Date())}
function mdw(s){var d=pd(s);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'（'+WD.charAt(d.getDay())+'）'}
function inDays(s){var n=Math.round((pd(s)-pd(todayS()))/864e5);return n===0?'今天':n===1?'明天':n===2?'後天':n>0?n+' 天後':n===-1?'昨天':(-n)+' 天前'}
function chipText(it){return ICON[it.kind]+(it.kind==='event'?(it.time?it.time.replace(/^0/,'')+' ':'')+it.text:(it.short||it.text))}
function calTabs(){$$('#calTabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===calView)})}
$('calTabs').onclick=function(e){var b=e.target.closest('[data-v]');if(!b)return;calView=b.dataset.v;store.set('calView',calView);calTabs();renderCal()};
function yearData(y,cb){if(YC[y]){cb(YC[y]);return}
  api('getCalYear',y).then(function(d){var by={};d.items.forEach(function(it){(by[it.date]=by[it.date]||[]).push(it)});YC[y]={items:d.items,by:by};cb(YC[y])},
    function(e){if(e.code!=='auth'&&e.code!=='notmember')$('calBody').innerHTML='<p class="empty">網路不穩，請按「回到所有相簿」再進來一次</p>'})}
function loadCal(){if(!calSel)calSel=todayS();calTabs();renderCal()}
function refreshCal(){YC={};C=null;renderCal()}
function renderCal(){var y=pd(calSel).getFullYear();
  if(calView==='list'){renderList();return}
  if(!YC[y])$('calBody').innerHTML='<p class="empty">載入中，請稍等…</p>';
  yearData(y,function(Y){if(pd(calSel).getFullYear()!==y||calView==='list')return;
    if(calView==='day')renderDay(Y);else if(calView==='year')renderYear(Y);else renderMonth(Y)})}
function legend(){return'<div class="legend"><span class="chip k-event">📅 活動</span><span class="chip k-birthday">🎂 生日</span><span class="chip k-anniv">💝 紀念日</span><span class="chip k-milestone">👶 寶寶</span></div>'}
function renderMonth(Y){var d=pd(calSel),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),t=todayS();
  var h='<div class="cnav"><button class="btn" data-go="-1">◀</button><b>'+y+' 年 '+(m+1)+' 月</b><button class="btn" data-go="1">▶</button><button class="btn today" data-go="0">今天</button></div><div class="mgrid">';
  for(var i=0;i<7;i++)h+='<div class="wd'+(i===0?' sun':'')+'">'+WD.charAt(i)+'</div>';
  for(i=0;i<first.getDay();i++)h+='<div class="mc blank"></div>';
  for(var n=1;n<=days;n++){var s=ymd(new Date(y,m,n)),its=Y.by[s]||[],dw=new Date(y,m,n).getDay();
    h+='<button class="mc'+(its.length?' has':'')+(dw===0?' sun':'')+(s===t?' today':'')+(s===calSel?' sel':'')+'" data-d="'+s+'"><span class="n">'+n+'</span>';
    if(its.length)h+='<span class="ics">'+its.slice(0,3).map(function(it){return ICON[it.kind]}).join('')+(its.length>3?'<em>+'+(its.length-3)+'</em>':'')+'</span>';
    h+='</button>'}
  var sd=pd(calSel),sits=Y.by[calSel]||[];
  h+='</div>'+legend()+'<h2 class="selh">'+sd.getFullYear()+' 年 '+(sd.getMonth()+1)+' 月 '+sd.getDate()+' 日（'+WD.charAt(sd.getDay())+'）<small>'+inDays(calSel)+'</small></h2>'+dayList(sits);
  $('calBody').innerHTML=h}
function dayList(its){var h='';
  if(!its.length)h+='<p class="empty" style="margin:12px 0">這天還沒有事情</p>';
  its.forEach(function(it){h+='<div class="ci"><div class="k">'+ICON[it.kind]+'</div><div class="tx"><b>'+esc(it.text)+'</b>'+(it.time?'<small>'+esc(it.time)+'</small>':'')+(it.by?'<small>'+esc(it.by)+' 加的</small>':'')+'</div>'+
    (it.kind==='event'?'<div class="acts"><button class="btn x" data-ee="'+esc(it.id)+'">修改</button><button class="btn x" data-de="'+esc(it.id)+'">刪除</button></div>':(it.kind==='birthday'||it.kind==='anniv')&&!it.baby?'<button class="btn x" data-dd="'+esc(it.id)+'">刪除</button>':'')+'</div>'});
  return h+'<button class="big-btn" data-addday="1" style="margin-top:14px;font-size:1.05rem;min-height:64px">＋ 在這天新增活動</button>'}
function renderDay(Y){var its=Y.by[calSel]||[],d=pd(calSel);
  var h='<div class="cnav"><button class="btn" data-go="-1">◀</button><div class="dhead"><span style="font-size:1rem">'+d.getFullYear()+' 年</span><br>'+(d.getMonth()+1)+' 月 '+d.getDate()+' 日（'+WD.charAt(d.getDay())+'）<br><small style="font-size:.85rem;color:var(--soft)">'+inDays(calSel)+'</small></div><button class="btn" data-go="1">▶</button></div>';
  h+=dayList(its)+'<button class="btn" data-go="0" style="width:100%;margin-top:12px">回到今天</button>';
  $('calBody').innerHTML=h}
function renderYear(Y){var y=pd(calSel).getFullYear(),t=todayS();
  var h='<div class="cnav"><button class="btn" data-go="-1">◀</button><b>'+y+' 年</b><button class="btn" data-go="1">▶</button><button class="btn today" data-go="0">今年</button></div><div class="ygrid">';
  for(var m=0;m<12;m++){var first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),cnt=0,g='';
    for(var i=0;i<7;i++)g+='<i style="color:var(--soft)">'+WD.charAt(i)+'</i>';
    for(i=0;i<first.getDay();i++)g+='<i></i>';
    for(var n=1;n<=days;n++){var s=ymd(new Date(y,m,n)),c=(Y.by[s]||[]).length;cnt+=c;g+='<i class="'+(s===t?'today':c?'has':'')+'">'+n+'</i>'}
    h+='<button class="ym'+(t.slice(0,7)===ymd(first).slice(0,7)?' cur':'')+'" data-m="'+ymd(first)+'"><h3>'+(m+1)+' 月</h3><div class="g">'+g+'</div><small>'+(cnt?cnt+' 件事':'　')+'</small></button>'}
  $('calBody').innerHTML=h+'</div><p class="hint" style="text-align:center;color:var(--soft);margin-top:10px">點一個月份可以看那個月</p>'}
function renderList(){if(!C)$('calBody').innerHTML='<p class="empty">載入中，請稍等…</p>';else listHtml();if(calBusy)return;calBusy=true;
  api('getCal').then(function(c){calBusy=false;C=c;if(calView==='list')listHtml()},function(e){calBusy=false;if(e.code!=='auth'&&e.code!=='notmember')$('calBody').innerHTML='<p class="empty">網路不穩，請再試一次</p>'})}
function listHtml(){var h='<h2>📅 活動</h2>';
  if(!C.events.length)h+='<p class="empty" style="margin:8px 0">還沒有活動，按上面「＋ 新增活動」</p>';
  C.events.forEach(function(e){h+='<div class="ci'+(e.past?' past':'')+'"><div class="dt">'+esc(mdw(e.date))+'<small>'+esc(inDays(e.date))+'</small></div><div class="tx"><b>'+esc(e.text)+'</b>'+(e.time?'<small>'+esc(e.time)+'</small>':'')+(e.by?'<small>'+esc(e.by)+' 加的</small>':'')+'</div><div class="acts"><button class="btn x" data-ee="'+esc(e.id)+'">修改</button><button class="btn x" data-de="'+esc(e.id)+'">刪除</button></div></div>'});
  h+='<h2>🎂 生日和紀念日</h2>';
  if(!C.days.length)h+='<p class="empty" style="margin:8px 0">還沒有，按上面「＋ 生日紀念日」</p>';
  C.days.forEach(function(x){h+='<div class="ci"><div class="dt">'+(x.next?esc(mdw(x.next))+'<small>'+esc(inDays(x.next))+'</small>':'')+'</div><div class="tx"><b>'+esc(x.label)+'</b><small>'+(x.cal==='農曆'?'農曆 ':'')+x.m+'/'+x.d+(x.baby?'・寶寶相簿的生日':'')+'</small></div>'+(x.baby?'':'<button class="btn x" data-dd="'+esc(x.id)+'">刪除</button>')+'</div>'});
  if(C.milestones.length){h+='<h2>👶 寶寶的日子</h2>';C.milestones.forEach(function(x){h+='<div class="ci"><div class="dt">'+esc(mdw(x.date))+'<small>'+esc(inDays(x.date))+'</small></div><div class="tx"><b>'+esc(x.text)+'</b></div></div>'})}
  $('calBody').innerHTML=h}
function findEvent(id){var f=null;Object.keys(YC).forEach(function(y){YC[y].items.forEach(function(it){if(it.kind==='event'&&it.id===id)f=it})});
  if(!f&&C)C.events.forEach(function(e){if(e.id===id)f=e});return f}

  if((t=e.target.closest('[data-go]'))){var g=+t.dataset.go,d=pd(calSel);
    if(g===0)calSel=todayS();else if(calView==='day')calSel=addD(calSel,g);else if(calView==='year')calSel=ymd(new Date(d.getFullYear()+g,0,1));else calSel=ymd(new Date(d.getFullYear(),d.getMonth()+g,1));
    renderCal();return}
  if((t=e.target.closest('[data-d]'))){calSel=t.dataset.d;renderCal();var sh=$('calBody').querySelector('.selh');if(sh)sh.scrollIntoView({behavior:'smooth',block:'start'});return}
  if((t=e.target.closest('[data-m]'))){calSel=t.dataset.m;calView='month';calTabs();renderCal();return}

  if((t=e.target.closest('[data-ee]'))){var ev=findEvent(t.dataset.ee);if(ev)eventForm(ev);return}
  if((t=e.target.closest('[data-de]'))){var id=t.dataset.de;ask('要刪除這個活動嗎？','刪除',function(){api('deleteEvent',id).then(refreshCal,function(){done('沒有刪除成功，請再試一次')})});return}
  if((t=e.target.closest('[data-dd]'))){var id2=t.dataset.dd;ask('要刪除這個生日或紀念日嗎？','刪除',function(){api('deleteDay',id2).then(refreshCal,function(){done('沒有刪除成功，請再試一次')})})}});

$('dayAdd').onclick=function(){var cal='國曆',kind='生日';
  var opt=function(n,a){var o='';for(var i=1;i<=n;i++)o+='<option'+(i===a?' selected':'')+'>'+i+'</option>';return o};

  $('sKind').onclick=function(e){var b=e.target.closest('[data-k]');if(!b)return;kind=b.dataset.k;$$('#sKind .btn').forEach(function(x){x.setAttribute('aria-pressed',x===b)});$('dNameL').textContent=kind==='生日'?'誰的生日':'什麼紀念日';$('dName').placeholder=kind==='生日'?'例如：阿嬤':'例如：爸媽結婚';$('dY').placeholder=kind==='生日'?'出生年':'哪一年'};
  $('sCal').onclick=function(e){var b=e.target.closest('[data-c]');if(!b)return;cal=b.dataset.c;$$('#sCal .btn').forEach(function(x){x.setAttribute('aria-pressed',x===b)})};
  $('sNo').onclick=closeSheet;
  $('sYes').onclick=function(){var n=$('dName').value.trim(),y=$('dY').value.trim();if(!n){done(kind==='生日'?'請寫是誰的生日':'請寫是什麼紀念日');return}
    if(y&&!/^(19|20)\d\d$/.test(y)){done('年請寫 4 個數字，例如 1950，或空著');return}
    this.disabled=true;api('addDay',n,kind,cal,$('dM').value,$('dD').value,y).then(function(){closeSheet();refreshCal()},function(e){done(e.message||'沒有存成功，請再試一次')})}};
